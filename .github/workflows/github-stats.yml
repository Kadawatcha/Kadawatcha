name: Update GitHub Stats

on:
  schedule:
    - cron: "0 2 * * *" # tous les jours à 02:00
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: anuraghazra/github-readme-stats@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        with:
          username: Kadawatcha
          count_private: true
          show_icons: true
          theme: transparent
          hide_border: true
          output: assets/github-stats.svg

      - name: Generate top languages
        uses: anuraghazra/github-readme-stats@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        with:
          username: Kadawatcha
          count_private: true
          layout: compact
          theme: transparent
          hide_border: true
          output: assets/top-langs.svg

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update GitHub stats"
          add: "assets/*.svg"
