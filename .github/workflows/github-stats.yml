name: Update GitHub Stats
on:
  schedule:
    - cron: "0 15 * * *" # Tous les jours à 15:00 UTC (16h ou 17h en France)
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # --- ÉTAPE 1 : CHIFFRES CLÉS (COMMITS, PR, REPOS) ---
      - name: Génération des statistiques de contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          template: classic
          # base : header (avatar/nom), activity (commits/PRs), repositories (total repos/stockage), metadata (chiffres bruts)
          base: header, activity, repositories, metadata
          config_locale: fr
          
          # --- REPO LE PLUS IMPORTANT ---
          plugin_repositories: yes
          # Affiche les repos épinglés (pinned) par défaut, ce qui correspond aux "plus importants"
          
          config_timezone: Europe/Paris
          output_action: commit
          filename: assets/github-stats.svg

      # --- ÉTAPE 2 : LANGAGES LES PLUS UTILISÉS ---
      - name: Génération du graphique des langages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          base: "" # On ne répète pas l'avatar ici
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          # On garde tout (HTML et CSS inclus)
          output_action: commit
          filename: assets/top-langs.svg
