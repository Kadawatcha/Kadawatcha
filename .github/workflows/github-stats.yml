name: Update GitHub Stats
on:
  schedule:
    - cron: "0 15 * * *" # Tous les jours à 15:00 UTC
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # --- ÉTAPE 1 : STATS GÉNÉRALES, PR, COMMITS ET REPO LE PLUS ACTIF ---
      - name: Statistiques Générales
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          template: classic
          # 'header' pour le profil, 'metadata' pour les compteurs (Commits, PR, Repos)
          base: header, metadata
          
          # --- TON REPO LE PLUS ACTIF (Celui avec le plus de commits récents) ---
          plugin_habits: yes
          plugin_habits_from: 200       # Analyse les 200 derniers événements
          plugin_habits_facts: yes      # Affiche les faits (ex: "Most active repository")
          plugin_habits_charts: no      # On désactive les graphiques pour rester propre
          
          # --- DÉTAILS DES CONTRIBUTIONS (PR & ISSUES) ---
          plugin_followup: yes
          plugin_followup_sections: user
          
          # --- DÉTAILS DES COMMITS ET LIGNES DE CODE ---
          plugin_lines: yes
          
          # --- INFOS SUR LES DEPOTS (PUBLIC/PRIVÉ) ---
          plugin_repositories: yes
          plugin_repositories_featured: ""
          
          config_timezone: Europe/Paris
          output_action: commit
          filename: assets/github-stats.svg

      # --- ÉTAPE 2 : LANGAGES LES PLUS UTILISÉS ---
      - name: Langages les plus utilisés
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          base: "" 
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          output_action: commit
          filename: assets/top-langs.svg
