name: Update GitHub Stats
on:
  schedule:
    - cron: "0 15 * * *" # Tous les jours à 15:00 UTC (16h ou 17h en France)
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # --- ÉTAPE 1 : CHIFFRES CLÉS (COMMITS, PR, REPOS) ---
      - name: Génération des statistiques de contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          template: classic
          # header : avatar/nom
          # repositories : nb de repos publics et privés
          # metadata : nb de commits, PR, et issues (chiffres bruts)
          base: header, repositories, metadata
          
          # --- REPO LE PLUS ACTIF ---
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: no # Pas de graphique, juste le nom du repo
          
          # --- LIGNES DE CODE (OPTIONNEL MAIS VALORISANT) ---
          plugin_lines: yes
          
          config_timezone: Europe/Paris
          output_action: commit
          filename: assets/github-stats.svg

      # --- ÉTAPE 2 : LANGAGES LES PLUS UTILISÉS ---
      - name: Génération du graphique des langages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          base: "" # On ne répète pas l'avatar ici
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          # On garde tout (HTML et CSS inclus)
          output_action: commit
          filename: assets/top-langs.svg
