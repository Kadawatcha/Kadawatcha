name: Update GitHub Stats
on:
  schedule:
    - cron: "0 2 * * *" # Tous les jours à 02:00
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          # Configuration pour sauvegarder dans le dépôt
          output_action: commit
          committer_gist: ${{ github.repository_owner }}
          filename: assets/github-stats.svg



      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Kadawatcha
          filename: assets/top-langs.svg # Nom du deuxième fichier
          base: "" # On ne met pas l'en-tête ici, juste les langages
          plugin_languages: yes
          plugin_languages_ignored: html, css # Optionnel : ignorer certains langages
          plugin_languages_details: percentage
          output_action: commit
